name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aurum_ci
          POSTGRES_USER: aurum_ci
          POSTGRES_PASSWORD: aurum_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum_ci -d aurum_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://aurum_ci:aurum_ci_password@localhost:5432/aurum_ci?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CONNECTED_SOURCE_SECRET_KEY: ci-only-connected-source-key
      AURUM_INSIGHTS_MODE: rules
      AURUM_LLM_ENABLED: false
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Validate Prisma schema
        run: pnpm --filter api exec prisma validate

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run API unit tests
        run: pnpm --filter api test

      - name: Run API end-to-end tests
        run: pnpm --filter api test:e2e

      - name: Run mobile-shell contract tests
        run: pnpm --filter mobile-shell test

      - name: Build
        run: pnpm build
