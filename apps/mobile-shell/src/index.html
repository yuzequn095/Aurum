<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https:"
    />
    <title>Aurum</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./runtime-config.js" defer></script>
    <script src="./bootstrap.js" defer></script>
  </head>
  <body>
    <main class="shell-card" aria-labelledby="title">
      <div class="mark" aria-hidden="true">A</div>
      <p class="eyebrow">AURUM</p>
      <h1 id="title">Opening your secure workspace</h1>
      <p class="message">Connecting to the trusted Aurum web application.</p>
      <div class="spinner" aria-hidden="true"></div>
      <p class="diagnostic" id="diagnostic">AURUM-MOBILE-BOOTSTRAP</p>
    </main>
  </body>
</html>
